[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-wiki"
dynamic = ["version"]
description = "Deterministic core for an LLM-maintained wiki"
requires-python = ">=3.12"
dependencies = [
    "typer~=0.27",
    "pydantic~=2.14",
    "pyyaml~=6.0",
    "rapidfuzz~=3.14",
    "platformdirs~=4.13",
    "markitdown[docx,pptx,xlsx,pdf]~=0.1.9",
    "python-pptx~=1.0",
    "openpyxl~=3.1",
    "pypdf~=6.21",
    "pillow~=13.0",
    "imagehash~=4.3",
]

[project.optional-dependencies]
docling = ["docling~=2.142"]
dev = ["pytest~=9.1", "python-docx~=1.2"]

[project.scripts]
wiki = "llm_wiki.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "llm_wiki.__version__"}

[tool.setuptools.package-data]
llm_wiki = ["templates/*", "templates/**/*", "prompts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
# pytest puts tests/ on sys.path, so tests can `from conftest import ...`
extraPaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# Ruff >= 0.16 defaults already cover F, B, UP, SIM, RUF, PL*, FURB, PT and more
extend-select = ["E", "W", "I", "UP", "B", "SIM", "RUF"]
# ‹› delimit redaction marks; – and — appear in user-facing prose on purpose
allowed-confusables = ["‹", "›", "–"]

[tool.ruff.lint.flake8-bugbear]
# Typer reads parameter specs from defaults; they are never mutated
extend-immutable-calls = ["typer.Argument", "typer.Option"]
