[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-wiki"
dynamic = ["version"]
description = "Deterministic core for an LLM-maintained wiki"
requires-python = ">=3.12"
dependencies = [
    "typer~=0.27",
    "pydantic~=2.14",
    "pyyaml~=6.0",
    "rapidfuzz~=3.14",
    "platformdirs~=4.13",
    "markitdown[docx,pptx,xlsx,pdf]~=0.1.9",
    "python-pptx~=1.0",
    "openpyxl~=3.1",
    "pypdf~=6.21",
    "pillow~=13.0",
    "imagehash~=4.3",
]

[project.optional-dependencies]
docling = ["docling~=2.142"]
dev = ["pytest~=9.1", "python-docx~=1.2"]

[project.scripts]
wiki = "llm_wiki.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "llm_wiki.__version__"}

[tool.setuptools.package-data]
llm_wiki = ["templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
