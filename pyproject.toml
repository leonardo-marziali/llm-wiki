[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
# The import package is llm_wiki and the command is `wiki`. PyPI refuses
# "llm-wiki" and "llm-wiki-cli" as too close to "llmwiki" and "llmwiki-cli"
name = "llm-wiki-tool"
dynamic = ["version"]
description = "CLI that keeps small, capped, LLM-maintained wikis for coding agents"
readme = "README.md"
authors = [{ name = "Leonardo Marziali" }]
keywords = ["wiki", "llm", "claude", "knowledge-base", "coding-agents"]
requires-python = ">=3.12"
dependencies = [
    "typer~=0.27",
    "pydantic~=2.14",
    "pyyaml~=6.0",
    "rapidfuzz~=3.14",
    "platformdirs~=4.13",
    "markitdown[docx,pptx,xlsx,pdf]~=0.1.9",
    "python-pptx~=1.0",
    "openpyxl~=3.1",
    "pypdf~=6.21",
    "pillow~=13.0",
    "imagehash~=4.3",
]

[project.optional-dependencies]
docling = ["docling~=2.142"]
dev = ["pytest~=9.1", "python-docx~=1.2", "pre-commit~=4.7"]

[project.urls]
Homepage = "https://github.com/leonardo-marziali/llm-wiki"
Changelog = "https://github.com/leonardo-marziali/llm-wiki/blob/main/CHANGELOG.md"
Issues = "https://github.com/leonardo-marziali/llm-wiki/issues"

[project.scripts]
wiki = "llm_wiki.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "llm_wiki.__version__"}

[tool.setuptools.package-data]
llm_wiki = ["templates/*", "templates/**/*", "prompts/*"]

[tool.semantic_release]
# .github/workflows/release.yml runs it on every push to main: it bumps
# __version__, updates CHANGELOG.md, commits, tags and creates the release
version_variables = ["src/llm_wiki/__init__.py:__version__"]
tag_format = "v{version}"
commit_parser = "conventional"
commit_message = "chore(release): {version} [skip ci]\n\nAutomatically generated by python-semantic-release"
# Stay on 0.x until 1.0.0 is cut on purpose
allow_zero_version = true
major_on_zero = false

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog]
mode = "update"
exclude_commit_patterns = ['chore\(release\): ']

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
# pytest puts tests/ on sys.path, so tests can `from conftest import ...`
extraPaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
# Ruff >= 0.16 defaults already cover F, B, UP, SIM, RUF, PL*, FURB, PT and more
extend-select = ["E", "W", "I", "UP", "B", "SIM", "RUF"]
# ‹› delimit redaction marks; – and — appear in user-facing prose on purpose
allowed-confusables = ["‹", "›", "–"]

[tool.ruff.lint.flake8-bugbear]
# Typer reads parameter specs from defaults; they are never mutated
extend-immutable-calls = ["typer.Argument", "typer.Option"]
