name: Publish

# release.yml creates the GitHub release; this uploads the package to PyPI.
# Run it by hand with a tag to retry a failed upload.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.2.0
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check that __version__ matches the tag
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/llm_wiki/__init__.py)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::__version__ is $version but the tag is $TAG"
            exit 1
          fi

      # A PyPI version can never be uploaded twice, so test before building
      - name: Test
        run: |
          python -m pip install --only-binary :all: -e '.[dev]'
          python -m pytest -q

      # Wheels only, so no setup script runs; build and twine are pinned
      - name: Build
        env:
          # also covers the isolated env that build creates for setuptools
          PIP_ONLY_BINARY: ":all:"
        run: |
          python -m pip install --only-binary :all: build==1.6.1 twine==7.0.0
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI trusts this repo, this workflow file and this
    # environment, so no API token is stored anywhere. Configure the trusted
    # publisher on pypi.org before the first release.
    environment:
      name: pypi
      url: https://pypi.org/p/llm-wiki-tool
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Attach the distributions to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
