# Git hooks, the Python counterpart of husky + commitlint.
# `pre-commit install` (run by the DevContainer) installs both hook types.
minimum_pre_commit_version: "4.7.0"
default_install_hook_types: [commit-msg, pre-push]

repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        # The @commitlint/config-conventional types; .github/workflows/pr-title.yml
        # checks PR titles against the same list
        args:
          - build
          - chore
          - ci
          - docs
          - feat
          - fix
          - perf
          - refactor
          - revert
          - style
          - test

  - repo: local
    hooks:
      - id: no-push-to-main
        name: block direct pushes to main
        entry: scripts/hooks/no-push-to-main.sh
        language: unsupported_script
        stages: [pre-push]
        always_run: true
        pass_filenames: false
